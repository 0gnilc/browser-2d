name: Set up workspace dependencies
description: Use the repository pnpm pin and one cached store for checkout and isolated builds
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        run_install: false
    - name: Select a store shared with isolated builds
      shell: bash
      run: echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/pnpm-store
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}
    - run: pnpm install --frozen-lockfile
      shell: bash
