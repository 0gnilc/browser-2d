name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance_scope:
        description: Native acceptance scope
        type: choice
        options: [full, process]
        default: full
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.acceptance_scope || 'full' }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance_scope == 'process' && 'Task process' || 'Native' }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, target: win-x64 }
          - { runner: macos-15-intel, target: mac-x64 }
          - { runner: macos-15, target: mac-arm64 }
          - { runner: ubuntu-24.04, target: linux-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 rpm libfuse2t64 dbus-x11 gnome-keyring libglib2.0-bin
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: ./.github/actions/setup-dependencies
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Export test Chrome path
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/testing/prepare-test-chrome.mjs
      - run: pnpm check
      - run: pnpm test:workflows
      - run: pnpm test
        if: github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'process'
      - run: pnpm test:release
        if: github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'process'
      - run: pnpm test:storage
        if: github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'process'
      - run: pnpm test:credentials
        if: github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'process'
      - name: Updater transport and lifecycle
        if: github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'process'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a pnpm test:updates; else pnpm test:updates; fi
      - name: Selected task process isolation
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a pnpm test:process; else pnpm test:process; fi
      - name: Electron integration and UI
        if: github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'process'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then dbus-run-session -- xvfb-run -a bash scripts/testing/linux-secret-session.sh pnpm test:electron; else pnpm test:electron; fi
      - name: Native distributables
        if: github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'process'
        run: pnpm dist -- --target=${{ matrix.target }}
      - name: Fused task process package
        if: github.event_name == 'workflow_dispatch' && inputs.acceptance_scope == 'process'
        run: pnpm package -- --target=${{ matrix.target }}
      - name: Fused package verification outside checkout
        if: github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'process'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then dbus-run-session -- xvfb-run -a bash scripts/testing/linux-secret-session.sh pnpm verify:package -- --target=${{ matrix.target }}; else pnpm verify:package -- --target=${{ matrix.target }}; fi
      - name: Fused task process verification outside checkout
        if: github.event_name == 'workflow_dispatch' && inputs.acceptance_scope == 'process'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a pnpm verify:package -- --target=${{ matrix.target }} --process-only; else pnpm verify:package -- --target=${{ matrix.target }} --process-only; fi
      - name: Preview native install, reinstall and uninstall
        if: github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'process'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then dbus-run-session -- xvfb-run -a bash scripts/testing/linux-secret-session.sh pnpm verify:installation; else pnpm verify:installation; fi
      - name: Exact ZIP or direct FUSE AppImage runtime
        if: runner.os != 'Windows' && (github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'process')
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then dbus-run-session -- xvfb-run -a bash scripts/testing/linux-secret-session.sh pnpm verify:formats -- --target=${{ matrix.target }}; else pnpm verify:formats -- --target=${{ matrix.target }}; fi
      - name: Install and run RPM in Fedora 44 userspace
        if: runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'process')
        shell: bash
        run: |
          mkdir -p artifacts/fedora44
          node --input-type=module -e 'import { identity, hashFile } from "./internal/build-config/release.mjs"; import { writeFile } from "node:fs/promises"; await writeFile("release/linux-x64/product-identity.json", JSON.stringify(identity)); await writeFile("release/linux-x64/executable.sha256", await hashFile(`release/linux-x64/linux-unpacked/${identity.executableName}`));'
          docker run --rm --init --shm-size=1g --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$PWD/release/linux-x64:/artifacts:ro" \
            -v "$PWD/scripts/packaging/verify-rpm.sh:/verify-rpm.sh:ro" \
            -v "$PWD/artifacts/fedora44:/evidence" fedora:44 bash /verify-rpm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance_scope == 'process' && 'task-process' || 'native' }}-${{ matrix.target }}
          path: |
            artifacts/
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.rpm
            release/*/*.blockmap
            release/*/*.yml
            release/*/build-context.json
            release/*/artifact-inventory.json
          compression-level: 0
          retention-days: 7
  acceptance:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance_scope == 'process' && 'Task process acceptance' || 'Native acceptance' }}
    if: always()
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the entire native matrix
        shell: bash
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          node -e "process.exit(process.env.NATIVE_RESULT === 'success' ? 0 : 1)"
