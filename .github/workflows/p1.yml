name: Intel Chrome profile diagnosis
on:
  push:
    branches: [codex/audit-chrome-profile-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: 156.0.8078.80
      - name: Preserve complete Chrome bundle
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/prepare-test-chrome.mjs
      - name: Record the exact diagnostic environment
        run: |
          mkdir -p artifacts/profile-probes
          node --version > artifacts/profile-probes/node-version.txt
          pnpm --version > artifacts/profile-probes/pnpm-version.txt
          git rev-parse HEAD > artifacts/profile-probes/source.txt
          git hash-object apps/worker/tests/chrome.test.ts > artifacts/profile-probes/test-blob.txt
          shasum -a 256 pnpm-lock.yaml > artifacts/profile-probes/lock.sha256
          "$BROWSER2D_CHROME_EXECUTABLE" --version > artifacts/profile-probes/chrome-version.txt
      - name: Bounded native cold-recovery probes
        shell: bash
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/profile-creation-fingerprint.cjs
          BROWSER2D_PROFILE_TRACE_DIR: ${{ github.workspace }}/artifacts/profile-probes
        run: |
          echo creation-only > artifacts/profile-probes/observation-mode.txt
          pnpm test:storage
          for attempt in $(seq 1 80); do
            log="$PWD/artifacts/profile-probes/attempt-$attempt.log"
            if pnpm --filter @browser-2d/worker-runtime exec vitest run tests/chrome.test.ts -t 'recovers a verified owned browser that exited before its release was journaled' > "$log" 2>&1; then
              echo "Cold-recovery probe $attempt passed"
            else
              cat "$log"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-profile-diagnosis
          path: artifacts/
          retention-days: 7
