name: Packaged ARM cleanup diagnosis
on:
  push:
    branches: ['codex/audit-arm-cleanup']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arm-cleanup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  arm-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Export test Chrome path
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/prepare-test-chrome.mjs
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm test:storage
      - run: pnpm test:observer
      - run: pnpm test:credentials
      - run: pnpm test:updates
      - run: pnpm test:electron
      - run: pnpm dist -- --target=mac-arm64
      - name: Fused package verification outside checkout
        env:
          BROWSER2D_ARM_DIAGNOSTIC: '1'
        run: |
          mkdir -p artifacts
          pnpm verify:package -- --target=mac-arm64 2>&1 | tee artifacts/arm-cleanup.log
      - name: Read-only final group observations
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const log = await readFile('artifacts/arm-cleanup.log', 'utf8').catch(() => '');
          for (const line of log.split('\n')) {
            if (!line.startsWith('{"diagnostic":"owned-lifetime-unknown"')) continue;
            const event = JSON.parse(line);
            let result = 'present';
            try { process.kill(-event.lifetime.pgid, 0); }
            catch (error) { result = error.code; }
            console.log(JSON.stringify({ diagnostic: 'observer-after-verifier', time: Date.now(), unknownAt: event.time, lifetime: event.lifetime, result }));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-cleanup-diagnostic
          path: |
            artifacts/
            release/*/build-context.json
            release/*/artifact-inventory.json
          retention-days: 7
