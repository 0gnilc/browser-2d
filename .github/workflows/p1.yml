name: P0-P3 desktop and scheduler
on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['docs/**', 'README.md', '.audit/**']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', '.audit/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win-x64
          - runner: macos-15-intel
            target: mac-x64
          - runner: macos-15
            target: mac-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.16.1
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 rpm libfuse2t64 dbus-x11 gnome-keyring libglib2.0-bin
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:storage
      - run: pnpm test:credentials
      - name: Electron integration and UI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then dbus-run-session -- xvfb-run -a bash scripts/linux-secret-session.sh pnpm test:electron; else pnpm test:electron; fi
      - name: Native distributables
        run: pnpm dist -- --target=${{ matrix.target }}
      - name: Fused package verification outside checkout
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then dbus-run-session -- xvfb-run -a bash scripts/linux-secret-session.sh pnpm verify:package -- --target=${{ matrix.target }}; else pnpm verify:package -- --target=${{ matrix.target }}; fi
      - name: Install and run RPM in Fedora 44 userspace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts/fedora44
          sha256sum release/linux-x64/linux-unpacked/browser-2d-foundation | cut -d ' ' -f 1 > release/linux-x64/executable.sha256
          docker run --rm --shm-size=1g --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$PWD/release/linux-x64:/artifacts:ro" \
            -v "$PWD/scripts/verify-rpm.sh:/verify-rpm.sh:ro" \
            -v "$PWD/artifacts/fedora44:/evidence" fedora:44 bash /verify-rpm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-${{ matrix.target }}
          path: |
            artifacts/
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.rpm
            release/*/*.blockmap
            release/*/build-context.json
          retention-days: 7
