name: Linux owned family native proof
on:
  push:
    branches: ['codex/audit-linux-family-proof']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-family-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: npm install --global pnpm@12.16.1
      - name: Linux desktop and native trace dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 rpm libfuse2t64 dbus-x11 gnome-keyring libglib2.0-bin bpftrace linux-tools-common linux-tools-generic linux-tools-$(uname -r)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test -r /sys/kernel/btf/vmlinux
          sudo bpftrace --info
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: 156.0.8078.80
      - name: Export test Chrome path
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/prepare-test-chrome.mjs
      - name: Native writer and lifetime trace
        run: bash scripts/audit-linux-family/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-family-native-proof
          path: artifacts/linux-family/
          retention-days: 7
