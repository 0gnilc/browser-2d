name: Packaged ARM cleanup diagnosis
on:
  push:
    branches: ['codex/audit-arm-cleanup']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arm-cleanup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  arm-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Export test Chrome path
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/prepare-test-chrome.mjs
      - run: pnpm typecheck
      - run: pnpm dist -- --target=mac-arm64
      - name: Fused package verification outside checkout
        run: pnpm verify:package -- --target=mac-arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-cleanup-diagnostic
          path: |
            artifacts/
            release/*/build-context.json
            release/*/artifact-inventory.json
          retention-days: 7
