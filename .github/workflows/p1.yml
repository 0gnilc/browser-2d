name: P6 exact artifact archive runtime diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  formats:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: macos-15-intel, target: mac-x64 }
          - { runner: macos-15, target: mac-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.16.1
      - name: Linux desktop dependencies and direct FUSE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libfuse2t64 dbus-x11 gnome-keyring libglib2.0-bin
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test -c /dev/fuse
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Export test Chrome path
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/prepare-test-chrome.mjs
      - uses: actions/download-artifact@v4
        with:
          name: p6-${{ matrix.target }}
          path: downloaded
          github-token: ${{ github.token }}
          run-id: 41184202293
      - name: Verify exact downloaded ZIP or direct AppImage
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts/extra-formats
          set -o pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a bash scripts/linux-secret-session.sh node scripts/verify-extra-formats.mjs 2>&1 | tee artifacts/extra-formats/runtime.log
          else
            node scripts/verify-extra-formats.mjs 2>&1 | tee artifacts/extra-formats/runtime.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-extra-${{ matrix.target }}
          path: artifacts/extra-formats
          retention-days: 7
