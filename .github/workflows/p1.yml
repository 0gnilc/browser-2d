name: Windows fused diagnostic
on:
  push:
    branches: ['codex/audit-win-startup']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: npm install --global pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: 156.0.8078.80
      - name: Export test Chrome path
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/prepare-test-chrome.mjs
      - run: pnpm typecheck
      - run: pnpm dist -- --target=win-x64
      - name: Bounded quiet fused diagnostic
        shell: bash
        run: |
          for invocation in {1..10}; do
            echo "Verification invocation $invocation of 10"
            export BROWSER2D_EVIDENCE_DIR="$PWD/artifacts/quiet-invocation-$invocation"
            pnpm verify:package -- --target=win-x64 || exit $?
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-diagnostic
          path: |
            artifacts/
            release/win-x64/build-context.json
            release/win-x64/artifact-inventory.json
          retention-days: 7
