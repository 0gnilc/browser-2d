name: Intel Chrome profile diagnosis
on:
  push:
    branches: [codex/audit-chrome-profile-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: 156.0.8078.80
      - name: Preserve complete Chrome bundle
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/prepare-test-chrome.mjs
      - name: Record the exact diagnostic environment
        run: |
          mkdir -p artifacts/profile-probes
          node --version > artifacts/profile-probes/node-version.txt
          pnpm --version > artifacts/profile-probes/pnpm-version.txt
          git rev-parse HEAD > artifacts/profile-probes/source.txt
          test "$(git rev-parse HEAD:apps/worker/src)" = "$(git rev-parse ee9a0e68da942295f3a5611ddbb4b0a99abe5953:apps/worker/src)"
          git rev-parse HEAD:apps/worker/src > artifacts/profile-probes/worker-source-tree.txt
          git hash-object apps/worker/tests/chrome.test.ts apps/worker/tests/chrome-family.test.ts apps/worker/tests/chrome-process.test.ts apps/worker/tests/chrome-journal.test.ts > artifacts/profile-probes/test-blobs.txt
          git ls-files -s apps/worker/src apps/worker/tests/chrome*.test.ts > artifacts/profile-probes/source-manifest.txt
          shasum -a 256 pnpm-lock.yaml > artifacts/profile-probes/lock.sha256
          "$BROWSER2D_CHROME_EXECUTABLE" --version > artifacts/profile-probes/chrome-version.txt
      - name: Bounded native cold-recovery probes
        shell: bash
        run: bash scripts/run-profile-namespace-probes.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-profile-diagnosis
          path: artifacts/
          retention-days: 7
