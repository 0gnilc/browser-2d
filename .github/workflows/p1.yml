name: P4 package probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.16.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 dbus-x11 gnome-keyring libglib2.0-bin
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: node scripts/prepare-test-chrome.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: pnpm package -- --target=linux-x64
      - run: dbus-run-session -- xvfb-run -a bash scripts/linux-secret-session.sh pnpm verify:package -- --target=linux-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-package-probe
          path: artifacts/
          retention-days: 3
